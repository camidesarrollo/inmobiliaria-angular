<app-home-hero />

<app-why-us />

<app-featured-properties />

<app-cta-banner />

<!-- Blog (7 columnas) + testimonios (5 columnas) -->
<section class="bg-surface py-space-3xl">
  <div class="container-luxe grid grid-cols-1 items-start gap-gutter lg:grid-cols-12 lg:gap-space-xl">
    <div class="flex flex-col gap-space-lg lg:col-span-7">
      <app-section-heading eyebrow="Perspectivas inmobiliarias" title="Nuestro blog" />
      @for (post of posts; track post.title) {
        <app-blog-preview [post]="post" />
      }
    </div>

    <div class="flex flex-col gap-space-lg lg:col-span-5">
      <app-section-heading eyebrow="Casos de éxito" title="Testimonios" />
      <app-testimonial-card [testimonial]="testimonial" />
    </div>
  </div>
</section>
