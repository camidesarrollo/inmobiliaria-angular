@let p = property();

<article class="group relative flex h-full flex-col overflow-hidden rounded-lg bg-white shadow-sm
                transition-all duration-300 ease-luxe hover:-translate-y-1 hover:shadow-xl">
  <!-- Imagen 4:3 con zoom suave al pasar el mouse -->
  <div class="relative aspect-4/3 overflow-hidden bg-surface-container">
    @if (p.image) {
      <img [src]="p.image" [alt]="p.title" loading="lazy"
           class="size-full object-cover transition-transform duration-700 ease-luxe group-hover:scale-105" />
    }
    <div class="absolute inset-0 bg-linear-to-t from-inverse-surface/40 via-transparent to-transparent"></div>

    <div class="absolute left-4 top-4 flex flex-wrap gap-1.5">
      @if (p.status) {
        <app-badge [variant]="p.status.tone === 'available' ? 'primary' : 'neutral'">{{ p.status.label }}</app-badge>
      }
      @if (p.exclusive) {
        <app-badge variant="secondary">Exclusiva</app-badge>
      }
      @if (p.tag) {
        <app-badge variant="glass">{{ p.tag }}</app-badge>
      }
    </div>

    <!-- z-10 para quedar sobre el enlace que cubre la tarjeta -->
    <button type="button"
            class="absolute right-4 top-4 z-10 grid size-10 cursor-pointer place-items-center rounded-full
                   bg-white/80 shadow-sm backdrop-blur-md transition-colors hover:text-error"
            [class]="favorite() ? 'text-error' : 'text-on-surface'"
            [attr.aria-pressed]="favorite()"
            [attr.aria-label]="favorite() ? 'Quitar de favoritos' : 'Guardar en favoritos'"
            (click)="toggleFavorite()">
      <app-icon name="heart" [filled]="favorite()" />
    </button>
  </div>

  <div class="flex flex-1 flex-col p-space-lg">
    @if (p.location) {
      <p class="mb-1 flex items-center gap-1 text-body-sm text-on-surface-variant">
        <app-icon name="location" [size]="16" class="text-primary" />
        {{ p.location }}
      </p>
    }
    <h3 class="mb-space-sm font-display text-headline-md text-on-surface transition-colors group-hover:text-primary">
      <!-- Enlace estirado: toda la tarjeta es clickeable -->
      <a [routerLink]="link()" class="after:absolute after:inset-0 focus-visible:outline-none">{{ p.title }}</a>
    </h3>

    @if (specs().length) {
      <dl class="mb-space-md grid auto-cols-fr grid-flow-col gap-1 rounded-md bg-surface-container p-space-xs text-center text-body-sm text-on-surface-variant">
        @for (s of specs(); track s.label) {
          <div class="flex flex-col-reverse py-1">
            <dt class="text-[11px]">{{ s.label }}</dt>
            <dd class="font-semibold text-on-surface">{{ s.value }}</dd>
          </div>
        }
      </dl>
    }

    <div class="mt-auto flex items-end justify-between gap-space-sm pt-space-xs">
      <app-price [uf]="p.priceUf" [clp]="p.priceClp" />
      <span aria-hidden="true"
            class="grid size-10 shrink-0 place-items-center rounded-full bg-surface-container-high text-on-surface
                   transition-colors group-hover:bg-primary-container group-hover:text-on-primary">
        <app-icon name="arrow-right" />
      </span>
    </div>
  </div>
</article>
