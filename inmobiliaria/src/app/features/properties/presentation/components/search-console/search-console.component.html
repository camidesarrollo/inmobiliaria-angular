<form role="search" aria-label="Buscar propiedades" (submit)="submit($event)"
      class="rounded-lg bg-white/80 p-space-md text-left shadow-2xl backdrop-blur-2xl">

  <!-- Tipo de propiedad -->
  <div class="mb-space-md flex items-center gap-space-xs" role="radiogroup" aria-label="Tipo de propiedad">
    @for (t of tabs(); track t.tipo; let i = $index) {
      <button type="button" role="radio"
              class="cursor-pointer rounded-full px-space-lg py-space-xs text-label-md transition-all"
              [class]="tab() === i ? 'bg-inverse-surface text-surface-bright shadow-sm' : 'bg-transparent text-on-surface-variant hover:text-on-surface'"
              [attr.aria-checked]="tab() === i"
              (click)="tab.set(i)">
        {{ t.label }}
      </button>
    }
    @if (eyebrow()) {
      <span class="ml-auto hidden text-label-caps uppercase tracking-widest text-secondary sm:inline-block">{{ eyebrow() }}</span>
    }
  </div>

  <div class="grid grid-cols-1 items-stretch gap-space-sm md:grid-cols-2 lg:grid-cols-4">
    <label class="flex cursor-pointer flex-col justify-center rounded-md bg-white p-space-sm shadow-sm">
      <span class="mb-1 flex items-center gap-1 text-label-caps uppercase text-on-surface-variant">
        <app-icon name="location" [size]="14" class="text-primary" /> Ubicación
      </span>
      <select class="w-full cursor-pointer bg-transparent py-0.5 font-display text-headline-sm text-on-surface outline-none"
              (change)="comuna.set(value($event) || null)">
        <option value="">Todas las comunas</option>
        @for (c of comunas(); track c) {
          <option [value]="c">{{ c }}</option>
        }
      </select>
    </label>

    <label class="flex cursor-pointer flex-col justify-center rounded-md bg-white p-space-sm shadow-sm">
      <span class="mb-1 flex items-center gap-1 text-label-caps uppercase text-on-surface-variant">
        <app-icon name="bed" [size]="14" class="text-primary" /> Dormitorios
      </span>
      <select class="w-full cursor-pointer bg-transparent py-0.5 font-display text-headline-sm text-on-surface outline-none"
              (change)="dormitorios.set(value($event) === '' ? null : +value($event))">
        <option value="">Todas las tipologías</option>
        @for (d of dormitoriosOpciones; track d) {
          <option [value]="d">{{ d }}+ dormitorios</option>
        }
      </select>
    </label>

    <label class="flex cursor-pointer flex-col justify-center rounded-md bg-white p-space-sm shadow-sm">
      <span class="mb-1 flex items-center gap-1 text-label-caps uppercase text-on-surface-variant">
        <app-icon name="trending-up" [size]="14" class="text-secondary" /> Rango de precio
      </span>
      <select class="w-full cursor-pointer bg-transparent py-0.5 font-display text-headline-sm text-on-surface outline-none"
              (change)="rango.set(value($event) === '' ? null : +value($event))">
        <option value="">Sin límite</option>
        @for (r of rangosUf(); track r.label; let i = $index) {
          <option [value]="i">{{ r.label }}</option>
        }
      </select>
    </label>

    <button type="submit"
            class="flex h-14 w-full cursor-pointer items-center justify-center gap-space-sm self-center rounded-full bg-primary-container
                   font-display text-headline-sm text-on-primary shadow-md transition-all duration-300
                   hover:-translate-y-0.5 hover:bg-primary">
      <app-icon name="search" [size]="20" />
      Buscar propiedades
    </button>
  </div>
</form>
